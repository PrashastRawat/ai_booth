    <path d="M113 36C108.5 33.5 104.5 34 101.5 37 104.5 37.8 107 39.6 108.6 42.6 109.4 40 110.6 37.8 113 36Z"/>
    <path d="M71 87.5C66.5 85 62.5 85.5 59.5 88.5 62.5 89.3 65 91.1 66.6 94.1 67.4 91.5 68.6 89.3 71 87.5Z"/>
    <path d="M34.5 118C31 115 27 115 23.5 117.5 26.5 118.6 28.8 119.8 30 121H35Z"/>
  </g>
  <!-- Vine -->
  <g fill="none" stroke-linecap="round">
    <path d="M10 119C14 98 22 78 34 60 46 42 62 28 82 18 92 13 101 10 110 8" stroke="#c99b48" stroke-width="1.3"/>
    <path d="M34 60C42 57 50 56 58 58M49 42C55 36 60 31 64 26" stroke="#c99b48" stroke-width="1"/>
  </g>
  <use href="#leaf" x="13" y="94" width="17" height="7.8" transform="rotate(-62 20 97)"/>
  <use href="#leaf" x="22" y="74" width="17" height="7.8" transform="rotate(28 29 77)"/>
  <use href="#leaf" x="36" y="55" width="17" height="7.8" transform="rotate(-20 43 58)"/>
  <use href="#leaf" x="44" y="45" width="17" height="7.8" transform="rotate(40 51 48)"/>
  <use href="#leaf" x="70" y="18" width="17" height="7.8" transform="rotate(-25 77 21)"/>
  <use href="#leaf" x="86" y="9" width="17" height="7.8" transform="rotate(15 93 12)"/>
  <use href="#leaf" x="98" y="2" width="17" height="7.8" transform="rotate(-18 105 5)"/>
  <use href="#leaf" x="55" y="52" width="15" height="6.9" transform="rotate(12 61 55)"/>
  <use href="#flower" x="51" y="10" width="28" height="28"/>
  <use href="#flower" x="8" y="66" width="27" height="27"/>
  <circle cx="64" cy="54" r="2" fill="#e27f72"/>
  <circle cx="96" cy="20" r="1.6" fill="#f2c25e"/>
