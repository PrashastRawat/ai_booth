      <stop offset="0" stop-color="#fbe1c1"/>
      <stop offset="1" stop-color="#feecd1"/>
    </linearGradient>
    <symbol id="leaf" viewBox="-7 -3.2 14 6.4">
      <path d="M-7 0C-4 -3.2 3 -3.2 7 0 3 3.2 -4 3.2 -7 0Z" fill="#6f8a4f"/>
      <path d="M-6 0H5.5" stroke="#a9b97c" stroke-width=".7"/>
    </symbol>
    <symbol id="flower" viewBox="-14 -14 28 28">
      <g fill="#d9505a">
        <ellipse cx="0" cy="-7.6" rx="4.6" ry="6.4"/>
        <ellipse cx="0" cy="-7.6" rx="4.6" ry="6.4" transform="rotate(45)"/>
        <ellipse cx="0" cy="-7.6" rx="4.6" ry="6.4" transform="rotate(90)"/>
        <ellipse cx="0" cy="-7.6" rx="4.6" ry="6.4" transform="rotate(135)"/>
        <ellipse cx="0" cy="-7.6" rx="4.6" ry="6.4" transform="rotate(180)"/>
        <ellipse cx="0" cy="-7.6" rx="4.6" ry="6.4" transform="rotate(225)"/>
        <ellipse cx="0" cy="-7.6" rx="4.6" ry="6.4" transform="rotate(270)"/>
        <ellipse cx="0" cy="-7.6" rx="4.6" ry="6.4" transform="rotate(315)"/>
      </g>
      <circle r="5.4" fill="#c3404a"/>
      <circle r="3.4" fill="#f2c25e"/>
      <circle r="1.5" fill="#fbe6a4"/>
    </symbol>
  </defs>
  <!-- Peach corner panel; the ivory header bulges into it in three cusped lobes. -->
  <path d="M0 0H133C120 7 110.5 21 113 36 95.5 37.5 76.5 51.5 75.5 70 75 76 73.5 82 71 87.5 53 88.5 38.5 98.5 35.5 112L34 121H0Z" fill="url(#fill)"/>
  <!-- Gold cusp ornaments -->
